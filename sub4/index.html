<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Sub 4</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sub 4">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&display=swap">
<style>
:root{--mta:#000;--white:#fff;--orange:#FF6319;--yellow:#FCCC0A;--grey:#A7A9AC;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff;font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:clip}
#game{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#page{position:relative;z-index:1;pointer-events:none}
#page *{pointer-events:auto}
.cond{font-family:"Barlow Condensed",Impact,"Arial Narrow",sans-serif}

/* HUD — MTA station sign */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;background:#000;border-bottom:3px solid #fff;padding:calc(var(--safe-top) + 8px) 14px 8px;display:flex;align-items:center;gap:12px;pointer-events:none}
#hud .bullet{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:19px;color:#fff;flex:none}
#hud .t{flex:1;min-width:0}
#hud .t b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.05}
#hud .t span{display:block;font-size:11px;color:var(--grey);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .r{text-align:right;font-size:11px;color:var(--grey);text-transform:uppercase;letter-spacing:.04em;line-height:1.2}
#hud .r b{display:block;color:#fff;font-size:20px;font-family:"Barlow Condensed",Impact,sans-serif;font-weight:800;letter-spacing:0;line-height:1}
#mini{position:fixed;right:6px;top:calc(var(--safe-top) + 84px);bottom:calc(var(--safe-bot) + 24px);width:8px;z-index:5;border-radius:4px;overflow:hidden;background:#1a1a1a;pointer-events:auto}
#mini i{position:absolute;left:0;right:0;display:block}
#mini .cam{position:absolute;left:-3px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #000;margin-top:-7px}
#mini .fill{position:absolute;left:0;right:0;top:0;background:var(--orange);opacity:.9}

/* SIGNS (run cards) */
.sign{position:absolute;width:var(--cw);background:#000;border:2px solid #fff;border-radius:4px;padding:8px 10px 8px 8px;display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;cursor:pointer;transform:translateY(-50%);box-shadow:0 4px 0 #000}
.sign .b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff}
.sign .b.dark{color:#000}
.sign .d{font-size:10px;color:var(--grey);text-transform:uppercase;letter-spacing:.06em;line-height:1.2}
.sign .m{font-size:22px;font-weight:700;line-height:1.05;letter-spacing:-.01em}
.sign .m small{font-size:12px;font-weight:400;color:#ddd;margin-left:6px;letter-spacing:0}
.sign .arr{font-size:22px;color:#fff;font-weight:700;padding:0 2px}
.sign.done{border-color:var(--orange)}
.sign.done .b{background:var(--orange)!important;color:#000!important}
.sign.done .m{text-decoration:line-through;text-decoration-color:var(--orange);text-decoration-thickness:3px;color:#bbb}
.sign.done .arr{color:var(--orange)}
.sign.today{outline:3px solid var(--yellow);outline-offset:3px}
.sign .why{grid-column:1/-1;font-size:12px;color:#ccc;line-height:1.35;border-top:1px solid #333;padding-top:6px;display:none}
.sign.open .why{display:block}
.sign .log{grid-column:1/-1;display:none;gap:6px;grid-template-columns:1fr 1fr;padding-top:6px}
.sign.open .log{display:grid}
.sign .log input,.sign .log select,.sign .log textarea{width:100%;font:inherit;font-size:14px;padding:7px 8px;border:1px solid #444;border-radius:3px;background:#111;color:#fff}
.sign .log textarea{grid-column:1/-1;resize:vertical;min-height:40px}
.sign .log input:focus,.sign .log select:focus,.sign .log textarea:focus{outline:2px solid var(--yellow);outline-offset:0}
.sign .log .row{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;align-items:center}
.sign .log button{font:inherit;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#000;background:var(--orange);border:0;border-radius:3px;padding:8px 12px;cursor:pointer}
.sign.done .log button{background:#333;color:#ddd}

/* banners / start / finish */
.start{position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.start h1{margin:0;font-family:"Barlow Condensed",Impact,sans-serif;font-weight:800;font-size:clamp(90px,26vw,220px);line-height:.85;letter-spacing:-.02em;color:#fff;text-shadow:0 6px 0 #000}
.start h1 span{color:var(--orange)}
.start p{margin:8px 0 0;font-size:14px;color:#ddd;text-transform:uppercase;letter-spacing:.16em}
.start p b{color:var(--yellow)}
.finish{position:absolute;left:0;right:0;text-align:center;padding:0 16px}
.finish h2{margin:0;font-family:"Barlow Condensed",Impact,sans-serif;font-weight:800;font-size:clamp(64px,18vw,150px);line-height:.9;text-shadow:0 6px 0 #000}
.finish h2 span{color:var(--orange)}
.finish .p{font-size:13px;color:#eee;text-transform:uppercase;letter-spacing:.12em;margin-top:6px}
.result{margin:16px auto 0;display:inline-grid;grid-template-columns:auto auto;gap:10px;align-items:center;background:#000;border:2px solid #fff;border-radius:4px;padding:10px 14px}
.result input{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:800;font-size:36px;width:160px;padding:2px 8px;border:1px solid #444;border-radius:3px;background:#111;color:#fff;text-align:center}
.result .v{font-weight:700;font-size:16px;color:var(--grey);text-align:left;max-width:180px;line-height:1.15}
.result .v.yes{color:#6CBE45}.result .v.no{color:var(--orange)}
.foot{margin-top:14px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.foot button,.foot a{font:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#fff;background:#000;border:2px solid #fff;border-radius:3px;padding:7px 12px;cursor:pointer;text-decoration:none}
#status{position:fixed;left:50%;bottom:calc(var(--safe-bot) + 16px);transform:translateX(-50%);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#000;background:var(--yellow);border-radius:3px;padding:8px 14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#status.show{opacity:1}
#status.warn{background:var(--orange)}
#sync{position:fixed;left:10px;bottom:calc(var(--safe-bot) + 10px);z-index:5;font-size:10px;color:var(--grey);text-transform:uppercase;letter-spacing:.08em}
#sync a{color:var(--yellow);text-decoration:none}
@media (prefers-reduced-motion: reduce){#status{transition:none}}
</style>
</head>
<body>
<script id="state" type="application/json">{"entries":{},"wknotes":{},"finish":""}</script>
<canvas id="game"></canvas>
<header id="hud">
  <div class="bullet" id="hudBullet" style="background:#EE352E">1</div>
  <div class="t"><b>SUB 4</b><span id="hudZone">NYC Marathon · Nov 1 · 9:09 per mile</span></div>
  <div class="r"><b id="hudDays">—</b>days out</div>
  <div class="r"><b><span id="hudRuns">0</span>/48</b>runs</div>
  <div class="r"><b id="hudMiles">0</b>miles</div>
</header>
<div id="mini"><i class="fill" id="miniFill" style="height:0"></i><i class="cam" id="miniCam" style="top:0"></i></div>
<div id="page"></div>
<div id="sync"></div>
<div id="status"></div>

<script>
(function(){
  'use strict';
  // ================= PLAN =================
  const PLAN = [
    {n:1, start:'2026-08-24', days:{tue:[4,'easy'],wed:[4,'easy'],thu:[5,'2 @ MP'],sat:[4,'easy'],sun:[12,'long']}},
    {n:2, start:'2026-08-31', days:{tue:[4,'easy'],wed:[5,'easy'],thu:[6.2,'10K TIME TRIAL'],sat:[4,'easy'],sun:[14,'long']}, tag:'THE GATE'},
    {n:3, start:'2026-09-07', days:{tue:[5,'easy'],wed:[5,'easy'],thu:[6,'4 @ MP'],sat:[4,'easy'],sun:[16,'long']}},
    {n:4, start:'2026-09-14', days:{tue:[4,'easy'],wed:[4,'easy'],thu:[5,'easy'],sat:[4,'easy'],sun:[12,'long']}, tag:'REST WEEK'},
    {n:5, start:'2026-09-21', days:{tue:[5,'easy'],wed:[5,'easy'],thu:[7,'5 @ MP'],sat:[4,'easy'],sun:[18,'last 5 @ MP']}},
    {n:6, start:'2026-09-28', days:{tue:[5,'easy'],wed:[5,'easy'],thu:[6,'3 tempo @ 8:30'],sat:[4,'easy'],sun:[14,'long']}},
    {n:7, start:'2026-10-05', days:{tue:[5,'easy'],wed:[5,'easy'],thu:[7,'5 @ MP'],sat:[4,'easy'],sun:[20,'last 6 @ MP']}, tag:'THE TEST'},
    {n:8, start:'2026-10-12', days:{tue:[5,'easy'],wed:[5,'easy'],thu:[6,'4 @ MP'],sat:[4,'easy'],sun:[22,'last 6 @ MP']}, tag:'PEAK'},
    {n:9, start:'2026-10-19', days:{tue:[4,'easy'],wed:[4,'easy'],thu:[5,'3 @ MP'],sat:[3,'easy'],sun:[12,'long']}},
    {n:10,start:'2026-10-26', days:{tue:[4,'easy'],wed:[3,'easy + strides'],thu:[2,'easy'],sun:[26.2,'RACE']}, tag:'RACE WEEK'},
  ];
  const ORDER = ['tue','wed','thu','sat','sun'], DN = {tue:'Tue',wed:'Wed',thu:'Thu',sat:'Sat',sun:'Sun'}, DOFF = {tue:1,wed:2,thu:3,sat:5,sun:6};
  const LINE = ['#EE352E','#00933C','#B933AD','#0039A6','#FF6319','#FCCC0A','#6CBE45','#996633','#A7A9AC','#EE352E'];
  const LINE_DARK = [false,false,false,false,false,true,false,false,true,false];
  const WHY = {easy:'Slower than feels right. 10:30–11:00. Conversational.', long:'10:15. Steady. Finish wanting one more.', RACE:'9:30 on the bridge. 9:05 through Brooklyn, half at 1:59. 9:00 on First Ave. Then everything you have left.', '10K TIME TRIAL':'Warm up a mile, then race 6.2 like it owes you money. Under 52:00 and sub-4 is on. 52–56, we aim 4:15.'};
  const RACE_DT = new Date('2026-11-01T09:00:00-05:00');
  const RUNS = [];
  PLAN.forEach(w => ORDER.forEach(d => { const p = w.days[d]; if (!p) return; const dt = new Date(w.start+'T12:00:00'); dt.setDate(dt.getDate()+DOFF[d]); RUNS.push({k:'w'+w.n+'-'+d, w, d, mi:p[0], what:p[1], dt, iso:isoOf(dt), first:d==='tue', race:p[1]==='RACE'}); }));
  function isoOf(t){ return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }
  const todayIso = isoOf(new Date());
  // boroughs: run index ranges
  const ZONES = [
    {name:'STATEN ISLAND', from:0,  to:9,  ground:'#241B38', ground2:'#2E2347', bld:['#4B3F6B','#5A4C80','#3E3459'], win:'#FFC978', face:'#2A2240', sky:'#1A1430'},
    {name:'BROOKLYN',      from:10, to:24, ground:'#2A1A16', ground2:'#34211B', bld:['#8C4A3C','#A65D4A','#7A3F33','#B5705A'], win:'#FFD89A', face:'#4A2A22', sky:'#1F1310'},
    {name:'QUEENS',        from:25, to:29, ground:'#17221F', ground2:'#1E2B27', bld:['#3F6B6B','#557F7F','#2F5757'], win:'#E8F7F2', face:'#213A3A', sky:'#101A18'},
    {name:'MANHATTAN',     from:30, to:39, ground:'#0F0C14', ground2:'#15101C', bld:['#2E2342','#3D2F5C','#241B36','#4A3A6E'], win:'#FF7AC8', win2:'#FFB067', face:'#1A1326', sky:'#0A0810'},
    {name:'THE BRONX',     from:40, to:44, ground:'#2A1212', ground2:'#361818', bld:['#7A2E2E','#9A3B3B','#612323'], win:'#FFE0A8', face:'#3E1A1A', sky:'#1E0D0D'},
    {name:'CENTRAL PARK',  from:45, to:48, ground:'#17301D', ground2:'#1E3B25', bld:[], win:'', face:'', sky:'#102216', park:true},
  ];
  // ================= STATE / PERSIST =================
  const $ = s => document.querySelector(s);
  let state = {entries:{}, wknotes:{}, finish:''};
  const SYNC = 'https://tools-sync.wadesellers.workers.dev/v1/sub430/log';
  const keyOf = () => localStorage.getItem('tools-sync-key') || '';
  const count = s => s ? Object.values(s.entries||{}).filter(e=>e.done||e.note||e.miles).length + (s.finish?1:0) : -1;
  let saveTimer = null;
  function flash(msg, warn){ const s = $('#status'); s.textContent = msg; s.className = 'show'+(warn?' warn':''); clearTimeout(s._t); s._t = setTimeout(()=>s.className='', 1500); }
  function setMode(){ $('#sync').innerHTML = keyOf() ? 'synced · <a href="#" id="keyBtn">key</a>' : 'this device only · <a href="#" id="keyBtn">connect sync</a>'; $('#keyBtn').onclick = e => { e.preventDefault(); const k = prompt('Sync key:', keyOf()); if (k===null) return; localStorage.setItem('tools-sync-key', k.trim()); setMode(); if (k.trim()) pull().then(()=>{ renderSigns(); save(); }); }; }
  function save(){ localStorage.setItem('sub430', JSON.stringify(state)); if (!keyOf()) return; clearTimeout(saveTimer); saveTimer = setTimeout(async () => { try { const r = await fetch(SYNC, {method:'PUT', headers:{'Content-Type':'application/json','X-Sync-Key':keyOf()}, body: JSON.stringify(state)}); if (r.status===401) { flash('Sync key rejected', true); return; } if (!r.ok) throw 0; } catch(_) { flash('Offline, kept here', true); } }, 1500); }
  async function pull(){ if (!keyOf()) return; try { const r = await fetch(SYNC, {headers:{'X-Sync-Key':keyOf()}, cache:'no-store'}); if (r.status===401) { flash('Sync key rejected', true); return; } if (r.status===404) return; const remote = await r.json(); if (remote && count(remote) >= count(state)) { state = remote; state.entries = state.entries||{}; } } catch(_) { flash('Offline, showing local', true); } }

  // ================= WORLD =================
  const canvas = $('#game'), ctx = canvas.getContext('2d', {alpha:false});
  const page = $('#page');
  let vw = 0, vh = 0, dpr = 1, H = 0, cx = 0, amp = 0, ROADW = 0, cardW = 0;
  let LUT = [];     // flat [x,y,...] every STEP px of path length
  const STEP = 4; let total = 0;
  let objs = [];    // world objects sorted by y: {y, y2, type, ...}
  let zoneY = [];   // zone y ranges
  let rnd;
  function mkRnd(seed){ let s = seed; return () => { s = (s*1103515245 + 12345) & 0x7fffffff; return s/0x7fffffff; }; }
  function fmt(n){ return Number.isInteger(n)? n : +n.toFixed(1); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
  function fmtDate(dt){ return (dt.getMonth()+1)+'/'+dt.getDate(); }

  function build(){
    vw = document.documentElement.clientWidth; vh = window.innerHeight; dpr = Math.min(window.devicePixelRatio||1, 2);
    canvas.width = Math.round(vw*dpr); canvas.height = Math.round(vh*dpr); canvas.style.width = vw+'px'; canvas.style.height = vh+'px';
    const mobile = vw < 600;
    cx = vw/2; amp = mobile ? vw*0.27 : Math.min(vw*0.22, 230); ROADW = mobile ? 46 : 58; cardW = mobile ? Math.min(214, vw*0.56) : 290;
    const GAP = mobile ? 620 : 560; const TOP = vh + 460;
    // waypoints, one per run
    const pts = RUNS.map((r,i) => ({x: cx + (i%2? amp : -amp) * (0.72 + 0.28*Math.abs(Math.sin(i*1.9))), y: TOP + i*GAP}));
    const endP = {x:cx, y:TOP + RUNS.length*GAP + 420};
    H = endP.y + vh*0.9;
    const all = [{x:cx, y:TOP-420}, ...pts, endP];
    // sample cubic chain into LUT by arc length
    const raw = []; // dense samples
    for (let i=1;i<all.length;i++){ const a=all[i-1], b=all[i]; const my=(a.y+b.y)/2; for (let t=0;t<=1;t+=1/60){ const mt=1-t; const x = mt*mt*mt*a.x + 3*mt*mt*t*a.x + 3*mt*t*t*b.x + t*t*t*b.x; const y = mt*mt*mt*a.y + 3*mt*mt*t*my + 3*mt*t*t*my + t*t*t*b.y; raw.push(x,y); } }
    LUT = [raw[0], raw[1]]; let acc = 0, px = raw[0], py = raw[1];
    for (let i=2;i<raw.length;i+=2){ const x=raw[i], y=raw[i+1]; const seg = Math.hypot(x-px, y-py); let need = STEP - acc; while (seg - (STEP - acc) >= 0 && need <= seg){ const t = need/seg; LUT.push(px + (x-px)*t, py + (y-py)*t); need += STEP; } acc = (acc + seg) % STEP; px = x; py = y; }
    total = (LUT.length/2 - 1) * STEP;
    // run → nearest LUT index (path is monotonic in y)
    RUNS.forEach((r,i) => { r.p = pts[i]; r.li = idxAtY(pts[i].y); r.len = r.li*STEP; });
    // zones → y ranges
    zoneY = ZONES.map(z => ({...z, y0: z.from===0 ? -1e9 : RUNS[z.from].p.y - GAP*0.5, y1: z.to===RUNS.length-1 ? 1e9 : RUNS[z.to].p.y + GAP*0.5}));
    buildObjects(GAP, mobile);
    page.style.height = H + 'px';
    renderSigns();
    drawMini();
    needsDraw = true; loop();
  }
  function idxAtY(y){ let lo=0, hi=LUT.length/2-1; while (lo<hi){ const m=(lo+hi)>>1; if (LUT[m*2+1] < y) lo=m+1; else hi=m; } return lo; }
  function pt(i){ i = Math.max(0, Math.min(LUT.length/2-1, i|0)); return {x:LUT[i*2], y:LUT[i*2+1]}; }
  function roadXAt(y){ return pt(idxAtY(y)).x; }
  function zoneAt(y){ for (const z of zoneY) if (y >= z.y0 && y < z.y1) return z; return zoneY[0]; }

  function buildObjects(GAP, mobile){
    objs = []; rnd = mkRnd(2026);
    const R = rnd;
    const yStart = zoneY[0].y0 === -1e9 ? 0 : zoneY[0].y0;
    // buildings: rows along y; each row tiles x in the free bands left/right of the road
    for (const z of zoneY){
      const y0 = Math.max(0, z.y0), y1 = Math.min(H, z.y1);
      if (z.park){
        // trees + lawn + paths
        for (let y=y0; y<y1; y+=18){ for (const side of [-1,1]){ if (R() > 0.5) continue; const rx = roadXAt(y); const off = ROADW*0.5 + 26 + R()*(mobile? 70 : 200); const x = rx + side*off; if (x < 6 || x > vw-6) continue; objs.push({y, y2:y+40, type:'tree', x, r: 9 + R()*13, c: ['#3E9A5E','#2C7A4E','#57B06F','#1F5A3C'][Math.floor(R()*4)]}); } }
        for (let y=y0; y<y1; y+=140){ objs.push({y, y2:y+3, type:'lamp', x: roadXAt(y+20) + (R()<0.5?-1:1)*(ROADW*0.5+14)}); }
        continue;
      }
      let y = y0; let rowN = 0;
      while (y < y1){
        const depth = 70 + R()*110; const gap = 12 + R()*10;
        const cross = rowN % 4 === 3; // cross street
        if (cross){ objs.push({y, y2:y+46, type:'cross'}); y += 46 + gap; rowN++; continue; }
        for (const side of [-1,1]){
          const rx0 = roadXAt(y), rx1 = roadXAt(y+depth); const edge = side<0 ? Math.min(rx0,rx1) - ROADW*0.5 - 22 : Math.max(rx0,rx1) + ROADW*0.5 + 22;
          let x = side<0 ? edge : edge; let avail = side<0 ? edge : vw - edge;
          while (avail > 24){
            const w = Math.min(avail, 34 + R()*70); const tall = z.name==='MANHATTAN' ? R()<0.5 : R()<0.15;
            const bx = side<0 ? x - w : x;
            objs.push({y, y2:y+depth, type:'bld', x:bx, w, h:depth, c: z.bld[Math.floor(R()*z.bld.length)], win: (R()<0.5 && z.win2)? z.win2 : z.win, face: z.face, tall, seed: Math.floor(R()*1e6), water: R()<0.25});
            x = side<0 ? bx - 6 : bx + w + 6; avail -= w + 6;
          }
        }
        // props along curb
        if (R() < 0.7){ const side = R()<0.5?-1:1; const py = y + R()*depth; const rx = roadXAt(py); const kinds = z.name==='MANHATTAN' ? ['cab','cab','hydrant','subway','cab'] : z.name==='QUEENS' ? ['cab','hydrant','truck'] : ['cab','hydrant','hydrant','trash','subway']; objs.push({y:py, y2:py+30, type: kinds[Math.floor(R()*kinds.length)], x: rx + side*(ROADW*0.5 + 10), side}); }
        y += depth + gap; rowN++;
      }
      // borough banner at zone start
      if (z.y0 > 0) objs.push({y: z.y0 + 60, y2: z.y0 + 140, type:'banner', text: z.name});
    }
    // manholes + crosswalks at runs
    RUNS.forEach((r,i) => { objs.push({y:r.p.y-40, y2:r.p.y+40, type:'xwalk', li:r.li, i}); if (i%3===1) objs.push({y:r.p.y+GAP*0.45, y2:r.p.y+GAP*0.45+12, type:'manhole', x: roadXAt(r.p.y+GAP*0.45) + (R()-0.5)*ROADW*0.5}); });
    // finish
    const fy = RUNS[RUNS.length-1].p.y + 420; objs.push({y:fy-140, y2:fy+40, type:'finish', x: roadXAt(fy), fy});
    objs.sort((a,b)=>a.y-b.y);
    // index: for range queries, objects overlapping [y0,y1]: since depth ≤ 200, scan from first obj with y >= y0-220

    if (e.target.closest('#mini')){ const r = $('#mini').getBoundingClientRect(); const f = (e.clientY - r.top)/r.height; window.scrollTo({top: f*(H-vh), behavior:'smooth'}); }
  });
  document.addEventListener('focusin', e => { const t = e.target; if ((t.dataset.f && t.dataset.f!=='done') || t.id==='finish'){ if (localStorage.getItem('sub4-pin') !== PIN){ t.blur(); unlocked(); } } });
  document.addEventListener('input', e => { const t = e.target; if (localStorage.getItem('sub4-pin') !== PIN) return; if (t.dataset.f && t.dataset.f!=='done'){ const k = t.closest('.sign').dataset.k; const en = state.entries[k] = state.entries[k]||{}; en[t.dataset.f] = t.value; save(); hudStats(); } else if (t.id==='finish'){ state.finish = t.value; verdict(true); save(); } });
  async function exportLog(){ const lines = ['SUB 4 · NYC Marathon 11/1/26']; let cw=0; RUNS.forEach(r => { const e = state.entries[r.k]; if (!e||!e.done) return; if (r.w.n!==cw){ cw=r.w.n; lines.push('', 'Week '+cw); } lines.push('  '+DN[r.d]+' '+fmtDate(r.dt)+': '+(e.miles||r.mi)+' mi'+(e.pace?' @ '+e.pace:'')+(e.felt?' · felt '+e.felt+'/5':'')+(e.note?' · '+e.note:'')); }); if (state.finish) lines.push('', 'Finish: '+state.finish); try { await navigator.clipboard.writeText(lines.join('\n')); flash('Copied'); } catch(_) { flash('Could not copy', true); } }

  // ================= BOOT =================
  async function boot(){
    try { const l = JSON.parse(localStorage.getItem('sub430')||'null'); if (l) state = l; } catch(_) {}
    state.entries = state.entries||{};
    build(); setMode();
    const before = count(state); await pull(); if (count(state) !== before) renderSigns();
    if (keyOf() && count(state) === before && before > 0) save();
    const at = new URLSearchParams(location.search).get('at'); if (at) window.scrollTo(0, +at);
    else { const t = document.querySelector('.sign.today'); if (t && window.scrollY < 10) setTimeout(()=>window.scrollTo({top: t.offsetTop - vh*0.46, behavior:'smooth'}), 500); }
  }
  if (document.fonts && document.fonts.load) document.fonts.load('800 40px "Barlow Condensed"').then(()=>{ needsDraw = true; loop(); });
  boot();
})();
</script>
